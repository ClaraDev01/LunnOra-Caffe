<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Playfair+Display+SC&display=swap"
        rel="stylesheet">
    <title>LunnOra Caffè</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <img src="./assets/logo/logo-lunnora.png" alt="Logo LunnOra">

            <div class="nav-links">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#populares">Populares</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#novidades">Novidades</a></li>
                </ul>
            </div>
            <button class="nav-btn">Contatar</button>
        </nav>
    </header>

    <main>
        <section id="home">
            <div class="hero-content">
                <div class="hero-text">
                    <span class="hero-subtitle">
                        ✦ Caffè Artesanal · Feito com alma
                    </span>
                    <h1>
                        Onde cada bebida
                        conta uma <span>história</span>
                    </h1>
                    <p>
                        Da primeira xícara da manhã a última golada da noite,
                        a LunnOra existe para transformar momentos simples
                        em memórias que ficam.
                    </p>
                    <div class="hero-buttons">
                        <a href="#about" class="primary-btn">
                            CONHECER
                        </a>
                        <a href="#news" class="secondary-btn">
                            CARDÁPIO
                        </a>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="./assets/hero/hero-drink.png" alt="Hero Drink">
                </div>
            </div>

        </section>
    </main>
</body>

</html>
